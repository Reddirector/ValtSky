<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Turn your Telegram channel into unlimited, zero-loss, 100% uncompressed private cloud storage.">
  
  <!-- Security Headers (OWASP Hardening) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self' https: wss: http://localhost:8088 http://127.0.0.1:8088 http://localhost:* http://127.0.0.1:* http://*:8088; object-src 'none'; base-uri 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ValtSky">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ValtSky — Zero-Loss Telegram Cloud Vault</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #000000;
      color: #FAFAFA;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: #A1A1AA;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #FFFFFF;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Initializing ValtSky Engine...</div>
  </div>

  <script>
    // Automatically hide loading screen the instant Flutter mounts
    (function handleLoader() {
      let observer = null;
      function hideLoader() {
        const loader = document.getElementById('loading');
        if (loader) loader.remove();
        if (observer) {
          observer.disconnect();
          observer = null;
        }
      }

      observer = new MutationObserver(function() {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
          hideLoader();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // In debug mode with DWDS, automatically trigger the entrypoint without waiting for Dart DevTools
      const startTimer = setInterval(function() {
        if (window.$dartRunMain && !window.$dartMainExecuted) {
          try {
            window.$dartRunMain();
            clearInterval(startTimer);
            hideLoader();
          } catch(e) {
            console.error("[ValtSky] Error executing $dartRunMain:", e);
          }
        } else if (window.$dartMainExecuted) {
          clearInterval(startTimer);
          hideLoader();
        }
      }, 50);
      setTimeout(function() { clearInterval(startTimer); }, 15000);
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if (window.caches) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
