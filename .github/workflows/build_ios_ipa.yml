name: Build iOS IPA & Publish Release Asset

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach IPA to'
        required: true
        default: 'v2.2'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Build iOS IPA (Sideload / AltStore / TrollStore / Sideloadly)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Telegram Secrets Template
        run: |
          if [ ! -f valtsky_flutter/lib/config/secrets.dart ]; then
            cp valtsky_flutter/lib/config/secrets.template.dart valtsky_flutter/lib/config/secrets.dart
          fi

      - name: Get Flutter Dependencies
        run: |
          cd valtsky_flutter
          flutter pub get

      - name: Configure Unsigned Sideloading Build Settings
        run: |
          echo "CODE_SIGNING_ALLOWED=NO" >> valtsky_flutter/ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> valtsky_flutter/ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> valtsky_flutter/ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY=" >> valtsky_flutter/ios/Flutter/Release.xcconfig
          cat valtsky_flutter/ios/Flutter/Release.xcconfig

      - name: Build iOS Application (Release, Unsigned)
        run: |
          cd valtsky_flutter
          flutter build ios --release --no-codesign || {
            echo "Flutter CLI required a team; running xcodebuild directly without code signing..."
            cd ios
            pod install
            xcodebuild build \
              -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath ../build/ios/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              EXPANDED_CODE_SIGN_IDENTITY=""
            mkdir -p ../build/ios/iphoneos
            cp -r ../build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app ../build/ios/iphoneos/
          }

      - name: Package Payload into Sideloadable .ipa
        run: |
          cd valtsky_flutter/build/ios
          RUNNER_PATH=$(find . -name "Runner.app" -type d | head -n 1)
          if [ -z "$RUNNER_PATH" ]; then
            echo "ERROR: Runner.app not found!"
            find . -maxdepth 4
            exit 1
          fi
          echo "Found Runner.app at $RUNNER_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -r "$RUNNER_PATH" Payload/
          zip -r ../../../valtsky-v2.2-release.ipa Payload
          cd ../../..
          ls -lh valtsky-v2.2-release.ipa
          shasum -a 256 valtsky-v2.2-release.ipa > valtsky-v2.2-release.ipa.sha256
          cat valtsky-v2.2-release.ipa.sha256

      - name: Upload IPA to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: valtsky-v2.2-release-ipa
          path: valtsky-v2.2-release.ipa

      - name: Attach .ipa Asset to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          echo "Attaching valtsky-v2.2-release.ipa to release ${TAG_NAME}..."
          gh release upload "${TAG_NAME}" valtsky-v2.2-release.ipa --clobber
