name: Build ValtSky APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Build Flutter Multiplatform Release APK
      run: |
        cd valtsky_flutter
        flutter pub get
        flutter build apk --release

    - name: Build Native Android with Gradle
      run: ./gradlew assembleDebug assembleRelease

    - name: Upload Flutter Release APK
      uses: actions/upload-artifact@v4
      with:
        name: valtsky-flutter-release-apk
        path: valtsky_flutter/build/app/outputs/flutter-apk/app-release.apk

    - name: Upload Native Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: valtsky-native-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Native Release APK
      uses: actions/upload-artifact@v4
      with:
        name: valtsky-native-release-unsigned-apk
        path: app/build/outputs/apk/release/app-release-unsigned.apk
